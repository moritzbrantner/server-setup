{
  "name": "marketing-site",
  "repo": "git@github.com:your-org/marketing-site.git",
  "branch": "main",
  "domain": "example.com",
  "workdir": "/srv/github-sites/marketing-site",
  "build_output": "dist",
  "deploy_hooks": {
    "pre_deploy": "echo Preparing deployment for marketing-site",
    "build": "npm ci && npm run build",
    "post_deploy": "sudo systemctl reload nginx"
  },
  "runtime": {
    "mode": "service",
    "command": "npm run start",
    "working_dir": ".",
    "user": "www-data",
    "env_file": "/etc/default/marketing-site",
    "port": 3000,
    "health_endpoint": "/healthz"
  },
  "service": {
    "name": "marketing-site.service",
    "reload_cmd": "sudo systemctl reload nginx"
  },
  "nginx": {
    "www_redirect": true,
    "tls_hostnames": [
      "example.com",
      "www.example.com"
    ]
  }
}
