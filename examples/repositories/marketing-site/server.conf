{
  "name": "marketing-site",
  "repo": "git@github.com:your-org/marketing-site.git",
  "branch": "main",
  "domain": "example.com",
  "workdir": "/srv/github-sites/marketing-site",
  "build_output": "dist",
  "pre_deploy": "echo Preparing deployment for marketing-site",
  "build": "npm ci && npm run build",
  "post_deploy": "sudo systemctl reload nginx",
  "command": "PORT=4003 npm run start",
  "user": "www-data",
  "env_file": "/etc/default/marketing-site",
  "port": 4003,
  "health_endpoint": "/healthz",
  "www_redirect": true,
  "tls_hostnames": [
    "example.com",
    "www.example.com"
  ]
}
