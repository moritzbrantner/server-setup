{
  "name": "rest-api",
  "domain": "api.localhost",
  "build_output": ".",
  "deploy_hooks": {
    "build": "POSTGRES_HOST=test-db POSTGRES_PORT=5432 POSTGRES_DB=server_setup POSTGRES_USER=server_setup POSTGRES_PASSWORD=server_setup ./scripts/init-db.sh"
  },
  "runtime": {
    "mode": "service",
    "command": "PORT=4001 POSTGRES_HOST=test-db POSTGRES_PORT=5432 POSTGRES_DB=server_setup POSTGRES_USER=server_setup POSTGRES_PASSWORD=server_setup python3 app.py",
    "working_dir": ".",
    "port": 4001,
    "health_endpoint": "/healthz",
    "health_retries": 10,
    "health_interval_seconds": 1
  },
  "service": {
    "name": "rest-api.service"
  },
  "nginx": {
    "www_redirect": false,
    "tls_hostnames": [
      "api.localhost"
    ]
  }
}
