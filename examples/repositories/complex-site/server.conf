{
  "name": "complex-site",
  "domain": "app.localhost",
  "build_output": ".",
  "deploy_hooks": {
    "build": "npm ci --no-fund --no-audit"
  },
  "runtime": {
    "mode": "service",
    "command": "PORT=4002 API_BASE_URL=http://127.0.0.1:4001 npm run start",
    "working_dir": ".",
    "port": 4002,
    "health_endpoint": "/healthz",
    "health_retries": 10,
    "health_interval_seconds": 1
  },
  "service": {
    "name": "complex-site.service"
  },
  "nginx": {
    "www_redirect": false,
    "tls_hostnames": [
      "app.localhost"
    ]
  }
}
