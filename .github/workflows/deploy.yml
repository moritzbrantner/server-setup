name: Deploy + Core Function Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-core-functions:
    name: Test core scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck python3

      - name: Bash syntax checks
        run: |
          bash -n scripts/init-server.sh
          bash -n scripts/ensure-server-tools.sh
          bash -n scripts/harden-server.sh
          bash -n scripts/install-nginx-site.sh
          bash -n scripts/setup-letsencrypt.sh
          bash -n scripts/sync-github-sites.sh

      - name: ShellCheck lint
        run: |
          shellcheck scripts/init-server.sh
          shellcheck scripts/ensure-server-tools.sh
          shellcheck scripts/harden-server.sh
          shellcheck scripts/install-nginx-site.sh
          shellcheck scripts/setup-letsencrypt.sh
          shellcheck scripts/sync-github-sites.sh

      - name: CLI help smoke tests
        run: |
          ./scripts/init-server.sh --help
          ./scripts/ensure-server-tools.sh --help
          ./scripts/harden-server.sh --help
          ./scripts/install-nginx-site.sh --help
          ./scripts/setup-letsencrypt.sh --help
          ./scripts/sync-github-sites.sh --help
          python3 monitor/dashboard.py --help

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: test-core-functions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /path/to/server-setup
            ./scripts/sync-github-sites.sh --config deploy/sites.json
