name: CI

on:
  pull_request:
  push: {}
  workflow_dispatch:

permissions:
  contents: read

# Same-repository branch pushes are first-class because coding agents and
# connector-authored PRs may not emit a usable pull_request check run. Both
# event types validate the same head SHA; concurrency collapses duplicate work.
concurrency:
  group: server-setup-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: monitor/webapp/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck python3 pipx
          pipx install ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run repository test suite
        run: ./tests/run-tests.sh

  host-sandbox:
    name: Host sandbox (${{ matrix.base_image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        base_image:
          - debian:12
          - ubuntu:24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run idempotent host bootstrap
        run: ./tests/host-sandbox/run.sh "${{ matrix.base_image }}"
