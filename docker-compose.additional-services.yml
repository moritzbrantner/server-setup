services:
  unlighthouse-server:
    image: ghcr.io/harlan-zw/unlighthouse:latest
    container_name: unlighthouse-server
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Optional auth token checked by upload clients.
      # Set this in your shell/.env before starting compose.
      UNLIGHTHOUSE_AUTH_TOKEN: "${UNLIGHTHOUSE_AUTH_TOKEN:-}"
    command:
      - unlighthouse-ci
      - --host
      - 0.0.0.0
      - --port
      - "5678"
      - --root
      - /data
    volumes:
      - unlighthouse_data:/data

volumes:
  unlighthouse_data:
