[project]
name = "server-setup"
version = "0.1.0"
description = "Opinionated, idempotent bootstrap and validation for a Dokploy host"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
server-setup = "server_setup.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = [
  ".git",
  ".next",
  "deploy",
  "monitor/webapp/node_modules",
  "monitor/webapp/.next",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
