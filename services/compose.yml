name: server-setup-services

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    restart: unless-stopped
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - ops

  beszel:
    image: henrygd/beszel:0.21.2@sha256:b0be90bd4aee2993fde763032a5098ce4386fba43cfe5031ec017b8d9e8c97a2
    restart: unless-stopped
    environment:
      APP_URL: "${BESZEL_APP_URL:-http://127.0.0.1:8090}"
    expose:
      - "8090"
    ports:
      - "127.0.0.1:${BESZEL_PORT:-8090}:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - ops

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2@sha256:343254226ae57a5cc6f8c23c755b1464730aba2abc7043116a2e222711ec6e1a
    profiles:
      - agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: "http://127.0.0.1:${BESZEL_PORT:-8090}"
      KEY: "${BESZEL_KEY:-}"
      TOKEN: "${BESZEL_TOKEN:-}"
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dnscontrol:
    image: ghcr.io/dnscontrol/dnscontrol:4.46.0@sha256:0523a71981a34a14d263b893b91a447397e44188b55a98ddedd06555150bb957
    profiles:
      - tools
    working_dir: /dns
    volumes:
      - ./dnscontrol:/dns

volumes:
  uptime_kuma_data:
  beszel_data:
  beszel_agent_data:
  beszel_socket:

networks:
  ops:
