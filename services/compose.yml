name: server-setup-services

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.3.2
    restart: unless-stopped
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - ops

  beszel:
    image: henrygd/beszel:0.18.8
    restart: unless-stopped
    environment:
      APP_URL: "${BESZEL_APP_URL:-http://127.0.0.1:8090}"
    expose:
      - "8090"
    ports:
      - "127.0.0.1:${BESZEL_PORT:-8090}:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - ops

  beszel-agent:
    image: henrygd/beszel-agent:0.18.8
    profiles:
      - agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: "http://127.0.0.1:${BESZEL_PORT:-8090}"
      KEY: "${BESZEL_KEY:-}"
      TOKEN: "${BESZEL_TOKEN:-}"
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dnscontrol:
    image: ghcr.io/dnscontrol/dnscontrol:v4.43.2
    profiles:
      - tools
    working_dir: /dns
    volumes:
      - ./dnscontrol:/dns

volumes:
  uptime_kuma_data:
  beszel_data:
  beszel_agent_data:
  beszel_socket:

networks:
  ops:
