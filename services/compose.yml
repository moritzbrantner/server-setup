name: server-setup-services

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
    restart: unless-stopped
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - ops

  beszel:
    image: henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    restart: unless-stopped
    environment:
      APP_URL: "${BESZEL_APP_URL:-http://127.0.0.1:8090}"
    expose:
      - "8090"
    ports:
      - "127.0.0.1:${BESZEL_PORT:-8090}:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - ops

  beszel-agent:
    image: henrygd/beszel-agent:0.21.1@sha256:cb6868012964d7a68debaa2c84bb72285e5f08531e81f506bd4c493bf052e41c
    profiles:
      - agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: "http://127.0.0.1:${BESZEL_PORT:-8090}"
      KEY: "${BESZEL_KEY:-}"
      TOKEN: "${BESZEL_TOKEN:-}"
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dnscontrol:
    image: ghcr.io/dnscontrol/dnscontrol:4.46.0@sha256:0523a71981a34a14d263b893b91a447397e44188b55a98ddedd06555150bb957
    profiles:
      - tools
    working_dir: /dns
    volumes:
      - ./dnscontrol:/dns

volumes:
  uptime_kuma_data:
  beszel_data:
  beszel_agent_data:
  beszel_socket:

networks:
  ops:
